<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- Titulo de pestana solicitado -->
  <title>Mapa del Merodeador</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>%F0%9F%97%BA%EF%B8%8F</text></svg>" />
  <!-- Ruta del juego: exige haber pronunciado el juramento (juramento.html) -->
  <script src="js/flujo.js" data-pagina="mapa.html"></script>
  <link rel="stylesheet" href="css/global.css" />
  <link rel="stylesheet" href="css/avatar.css" />
  <link rel="stylesheet" href="css/mapa.css" />
</head>
<body class="mapa-body">

  <!-- ======================= BARRA SUPERIOR ======================= -->
  <header class="hud" id="hud">
    <div class="hud-grupo">
      <button type="button" class="hud-boton" id="btn-misiones" aria-haspopup="dialog" aria-controls="panel-misiones">
        📜 Misiones <span class="hud-contador" id="contador-misiones">0/7</span>
      </button>
      <button type="button" class="hud-boton" id="btn-pistas" aria-haspopup="dialog" aria-controls="modal-pistas">
        🔍 Pistas <span class="hud-contador" id="contador-pistas">0</span>
      </button>
    </div>

    <div class="hud-tiempo" title="Tiempo restante">
      <span aria-hidden="true">⏳</span>
      <div class="barra-tiempo" role="progressbar" aria-label="Tiempo restante" aria-valuemin="0" aria-valuemax="100" id="barra">
        <div class="barra-relleno" id="barra-tiempo"></div>
      </div>
      <span class="hud-cifra" id="temporizador">40:00</span>
    </div>

    <div class="hud-grupo">
      <div class="vidas" id="vidas" aria-label="Vidas restantes">
        <span class="vida">❤️</span><span class="vida">❤️</span><span class="vida">❤️</span>
      </div>
      <div class="hud-espada" id="hud-espada" title="Espada de Gryffindor" aria-label="Espada de Gryffindor"></div>
      <button type="button" class="hud-boton" id="btn-pausa" aria-label="Pausa (tecla P)"><span aria-hidden="true">❚❚</span> Pausa</button>
    </div>
  </header>

  <!-- Lista de misiones (desplegable) -->
  <section class="panel-misiones oculto" id="panel-misiones" aria-label="Misiones">
    <h3>Misiones</h3>
    <ol class="lista-misiones" id="lista-misiones"></ol>
  </section>

  <!-- ======================= EL MAPA ======================= -->
  <!-- capa-plano: el castillo (debajo de la niebla)
       capa-alta: huellas, nombres y personajes (se ven a través de la niebla) -->
  <main class="vista" id="vista" aria-label="Mapa del Merodeador">
    <div class="capa-mundo" id="capa-plano"></div>
    <div class="niebla" id="niebla"></div>
    <div class="capa-mundo" id="capa-alta">
      <svg class="huellas-svg" viewBox="0 0 2400 1800" width="2400" height="1800" aria-hidden="true">
        <defs><g id="huella"><ellipse cy="-2.2" rx="2.7" ry="4.2" /><ellipse cy="4.8" rx="2.1" ry="2" /></g></defs>
        <g id="huellas"></g>
      </svg>
      <div id="antorchas"></div>
      <div id="entidades"></div>
    </div>
  </main>

  <!-- Avisos breves -->
  <div class="avisos" id="avisos" aria-live="polite"></div>

  <!-- ======================= DIÁLOGO ======================= -->
  <section class="dialogo oculto" id="dialogo" aria-labelledby="dialogo-nombre">
    <div class="dialogo-retrato" id="dialogo-retrato" aria-hidden="true"></div>
    <div class="dialogo-cuerpo">
      <h3 class="dialogo-nombre" id="dialogo-nombre"></h3>
      <p class="dialogo-texto" id="dialogo-texto" aria-live="polite"></p>
      <div class="dialogo-pie">
        <span class="dialogo-pasos" id="dialogo-pasos"></span>
        <div class="dialogo-acciones" id="dialogo-acciones"></div>
      </div>
    </div>
  </section>

  <!-- ======================= PAUSA ======================= -->
  <div class="pausa oculto" id="pausa" role="dialog" aria-modal="true" aria-labelledby="pausa-titulo">
    <div class="pausa-pergamino">
      <div class="pausa-icono" aria-hidden="true">🗺️</div>
      <h2 id="pausa-titulo">¡Travesura realizada!</h2>
      <p>El mapa se ha cerrado y el reloj está detenido.</p>
      <button type="button" class="btn-magico" id="btn-reanudar">Juro solemnemente… ✦ Reanudar</button>
      <p class="pausa-ayuda">Tecla P o Esc</p>
    </div>
  </div>

  <!-- ======================= PISTAS ======================= -->
  <div id="modal-pistas" class="overlay-modal oculto" role="dialog" aria-modal="true" aria-labelledby="pistas-titulo">
    <div class="pergamino">
      <button type="button" class="cerrar" data-cerrar aria-label="Cerrar">×</button>
      <h2 id="pistas-titulo">📜 Pistas recolectadas</h2>
      <ul class="lista-pistas" id="lista-pistas"></ul>
    </div>
  </div>

  <!-- ======================= CINEMÁTICAS (las rellena animaciones.js) ======================= -->
  <div class="cinematica oculto" id="cine"></div>

  <p class="ayuda-controles" aria-hidden="true">Flechas o WASD: moverse · E: hablar · P: pausa</p>

  <!-- Scripts: primero datos y piezas, después HUD y el motor del mapa -->
  <script src="js/avatar.js"></script>
  <script src="js/estado.js"></script>
  <script src="js/castillo.js"></script>
  <script src="js/historia.js"></script>
  <script src="js/animaciones.js"></script>
  <script src="js/hud.js"></script>
  <script src="js/mapa.js"></script>
</body>
</html>
