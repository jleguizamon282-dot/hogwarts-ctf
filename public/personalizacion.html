        <div class="stage-casa" id="stage-casa"><span id="stage-casa-nombre">Gryffindor</span></div>
      </section>

      <!-- ====================== PANEL DE OPCIONES ====================== -->
      <section class="panel" aria-label="Opciones de personalización">
        <div class="pestanas" role="tablist" aria-label="Categorías">
          <button type="button" class="pestana activa" role="tab" id="tab-aspecto" aria-controls="sec-aspecto" aria-selected="true">✨ Aspecto</button>
          <button type="button" class="pestana" role="tab" id="tab-equipo" aria-controls="sec-equipo" aria-selected="false" tabindex="-1">🪄 Equipo</button>
          <button type="button" class="pestana" role="tab" id="tab-casa" aria-controls="sec-casa" aria-selected="false" tabindex="-1">🛡️ Casa</button>
        </div>

        <!-- ---------- ASPECTO ---------- -->
        <div class="seccion" id="sec-aspecto" role="tabpanel" aria-labelledby="tab-aspecto">
          <div class="grupo">
            <h3>Peinado</h3>
            <div class="tarjetas cuatro" data-opcion="pelo">
              <button type="button" class="tarjeta" data-valor="1"><span class="mini" data-mini="pelo" data-variante="1"></span><span class="tarjeta-nombre">Alborotado</span></button>
              <button type="button" class="tarjeta" data-valor="2"><span class="mini" data-mini="pelo" data-variante="2"></span><span class="tarjeta-nombre">Melena</span></button>
              <button type="button" class="tarjeta" data-valor="3"><span class="mini" data-mini="pelo" data-variante="3"></span><span class="tarjeta-nombre">Con raya</span></button>
              <button type="button" class="tarjeta" data-valor="4"><span class="mini" data-mini="pelo" data-variante="4"></span><span class="tarjeta-nombre">Rizos</span></button>
            </div>
          </div>
          <div class="grupo">
            <h3>Color de pelo</h3>
            <div class="muestras" data-opcion="colorPelo"></div>
          </div>
          <div class="grupo dos">
            <div>
              <h3>Tono de piel</h3>
              <div class="muestras" data-opcion="piel"></div>
            </div>
            <div>
              <h3>Ojos</h3>
              <div class="muestras ojos" data-opcion="ojos"></div>
            </div>
          </div>
          <div class="grupo linea">
            <h3>Cicatriz de rayo</h3>
            <button type="button" class="interruptor" id="interruptor-cicatriz" role="switch" aria-checked="true" aria-label="Cicatriz de rayo"><span></span></button>
          </div>
        </div>

        <!-- ---------- EQUIPO ---------- -->
        <div class="seccion" id="sec-equipo" role="tabpanel" aria-labelledby="tab-equipo" hidden>
          <div class="grupo">
            <h3>Gafas</h3>
            <div class="tarjetas cuatro" data-opcion="gafas">
              <button type="button" class="tarjeta" data-valor="redondas"><span class="mini" data-mini="gafas" data-variante="redondas"></span><span class="tarjeta-nombre">Redondas</span></button>
              <button type="button" class="tarjeta" data-valor="cuadradas"><span class="mini" data-mini="gafas" data-variante="cuadradas"></span><span class="tarjeta-nombre">Cuadradas</span></button>
              <button type="button" class="tarjeta" data-valor="media-luna"><span class="mini" data-mini="gafas" data-variante="media-luna"></span><span class="tarjeta-nombre">Media luna</span></button>
              <button type="button" class="tarjeta" data-valor="ninguna"><span class="mini" data-mini="gafas" data-variante="ninguna"></span><span class="tarjeta-nombre">Sin gafas</span></button>
            </div>
          </div>
          <div class="grupo">
            <h3>Varita</h3>
            <div class="tarjetas tres" data-opcion="varita">
              <button type="button" class="tarjeta" data-valor="acebo"><span class="mini" data-mini="varita" data-variante="acebo"></span><span class="tarjeta-nombre">Acebo<small>y pluma de fénix</small></span></button>
              <button type="button" class="tarjeta" data-valor="sauco"><span class="mini" data-mini="varita" data-variante="sauco"></span><span class="tarjeta-nombre">Saúco<small>y pelo de thestral</small></span></button>
              <button type="button" class="tarjeta" data-valor="vid"><span class="mini" data-mini="varita" data-variante="vid"></span><span class="tarjeta-nombre">Vid<small>y fibra de dragón</small></span></button>
            </div>
          </div>
          <div class="grupo">
            <h3>Mascota</h3>
            <div class="tarjetas cuatro" data-opcion="mascota">
              <button type="button" class="tarjeta" data-valor="lechuza"><span class="mini" data-mini="mascota" data-variante="lechuza"></span><span class="tarjeta-nombre">Lechuza</span></button>
              <button type="button" class="tarjeta" data-valor="gato"><span class="mini" data-mini="mascota" data-variante="gato"></span><span class="tarjeta-nombre">Gato</span></button>
              <button type="button" class="tarjeta" data-valor="sapo"><span class="mini" data-mini="mascota" data-variante="sapo"></span><span class="tarjeta-nombre">Sapo</span></button>
              <button type="button" class="tarjeta" data-valor="ninguna"><span class="mini" data-mini="mascota" data-variante="ninguna"></span><span class="tarjeta-nombre">Ninguna</span></button>
            </div>
          </div>
        </div>

        <!-- ---------- CASA ---------- -->
        <div class="seccion" id="sec-casa" role="tabpanel" aria-labelledby="tab-casa" hidden>
          <p class="sombrero">«¿Dónde te pondré? El Sombrero Seleccionador escucha tu elección…»</p>
          <div class="estandartes" data-opcion="casa">
            <button type="button" class="casa-btn" data-valor="Gryffindor" style="--a:#8b1a1a;--b:#e8b830">
              <span class="estandarte"><span class="tela"><span class="emblema">🦁</span></span></span>
              <span class="casa-nombre">Gryffindor</span><span class="casa-virtud">Valor</span>
            </button>
            <button type="button" class="casa-btn" data-valor="Slytherin" style="--a:#1a5c34;--b:#c0c7cc">
              <span class="estandarte"><span class="tela"><span class="emblema">🐍</span></span></span>
              <span class="casa-nombre">Slytherin</span><span class="casa-virtud">Astucia</span>
            </button>
            <button type="button" class="casa-btn" data-valor="Ravenclaw" style="--a:#233a7a;--b:#c69a4e">
              <span class="estandarte"><span class="tela"><span class="emblema">🦅</span></span></span>
              <span class="casa-nombre">Ravenclaw</span><span class="casa-virtud">Sabiduría</span>
            </button>
            <button type="button" class="casa-btn" data-valor="Hufflepuff" style="--a:#e8b72a;--b:#2b2520">
              <span class="estandarte"><span class="tela"><span class="emblema">🦡</span></span></span>
              <span class="casa-nombre">Hufflepuff</span><span class="casa-virtud">Lealtad</span>
            </button>
          </div>
          <p class="casa-descripcion" id="casa-descripcion" aria-live="polite"></p>
        </div>

        <button type="button" id="btn-comenzar" class="btn-entrar"><span>Comenzar Aventura ✦</span></button>
      </section>
    </div>
  </main>

  <script src="js/personalizacion.js"></script>
</body>
</html>
